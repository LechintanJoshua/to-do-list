<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
</head>
<body>
    <div class="menu">
        <div class="top">
            <p>Menu</p>
            <div class="icon">
            </div>
        </div>

        <div class="search">
            <label for="search">
                <div class="icon">
                </div>
            </label>
            <input type="text" name="search" id="search" placeholder="Search" minlength="3">
        </div>

        <div class="tasks">
            Tasks
            <div class="tasks-list">
                <div data-category="Upcoming">
                <div class="icon">
                </div>
                Upcoming

                <div class="number">5</div>
            </div>
            <div data-category="Today">
                <div class="icon">
                </div>
                Today
                <div class="number">12</div>
            </div>
            <div data-category="Calendar">
                <div class="icon">
                </div>
                Calendar
            </div>
            </div>
        </div>
        
        <div class="lists">
            Lists

            <div class="list-type">
            <button class="add-list">
                <div class="icon">
                </div>
                Add New List
            </button>
                <div data-category="personal">
                <div class="icon list-red">
                </div>
                Personal
                <div class="number">1</div>
            </div>
            <div data-category="work">
                <div class="icon list-blue">
                </div>

                Work                
                <div class="number">4</div>
            </div>
            <div data-category="list">
                <div class="icon list-yellow">
                </div>
                List
                <div class="number">5</div>
            </div>
            </div>
        </div>

        <div class="tags">
            Tags
            <div class="tag-list">
                <div data-tag-name="tag1">Tag 1</div>
                <div data-tag-name="tag2">Tag 2</div>
            </div>
        </div>
    
        <div class="settings">
            <div class="icon">
            </div>
            Settings
        </div>
            <div class="sign-out">
            <div class="icon">
            </div>
            Sign out
        </div>
    </div>
    
    <div class="task-list">
        <div class="header-title">
            <h1>Today</h1>
            <div class="header-number">5</div>
        </div>

        <button class="add-new-task">
            <div class="icon"></div>
            Add New Task
        </button>

        <div class="tasks-container">
            <div class="task-item">
                <div class="task-main">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span>Research content ideas</span>
                    </label>
                    <div class="icon chevron-icon"></div>
                </div>
            </div>

            <div class="task-item">
                <div class="task-main">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span>Renew driver's license</span>
                    </label>
                    <div class="icon chevron-icon"></div>
                </div>

                <div class="task-meta">
                    <div class="meta-badge">
                        <div class="icon calendar-icon"></div>
                        22-03-22
                    </div>
                    <div class="meta-badge">
                        <div class="badge-number">1</div>
                        Subtasks
                    </div>
                    <div class="meta-badge">
                        <div class="list-color list-red"></div>
                        Personal
                    </div>
                </div>                
            </div>
                
            <div class="task-item">
                <div class="task-main">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span>Consult accountant</span>
                    </label>
                    <div class="icon chevron-icon"></div>
                </div>
                
                <div class="task-meta">
                    <div class="meta-badge">
                        <div class="list-color list-yellow"></div>
                        List
                    </div>
                    <div class="meta-badge">
                        <div class="badge-number">3</div>
                        Subtasks
                    </div>
                </div>
            </div>

            <div class="task-item">
                <div class="task-main">
                    <label class="custom-checkbox">
                        <input type="checkbox">
                        <span>Print business card</span>
                    </label>

                    <div class="icon chevron-icon"></div>
                </div>
            </div>
        </div>
    </div>  

    <div class="task-cr">
        <div class="top">
            <p>Task:</p>
        </div>

        <div class="details">
            <input type="text" name="task-title" id="task-title" placeholder="Task name here">
            <textarea name="description" id="description" placeholder="Description" rows="5" cols="50"></textarea>
        </div>

        <div class="miscellaneous">
            <div class="meta-row">
                <p>List</p>
                <select name="list-fam" id="list-fam">
                    <option value="">--Please choose an option--</option>
                    <option value="personal">Personal</option>
                    <option value="work">Work</option>
                </select>
            </div>
            
            <div class="meta-row">
                <p>Due date</p>
                <input type="date" name="due-date" id="due-date">
            </div>
            
            <div class="meta-row">
                <p>Tags</p>
                <div class="but-opt">
                    <button class="add-tag-btn">+ Add Tag</button>
                    <div data-tag-name="tag1">Tag 1</div>
                </div>
            </div>

            <div class="subtask">
                <p class="title">Subtasks:</p>

                <button class="add-sub">
                    <div class="icon"></div>
                    Add New Subtask
                </button>

                <div class="sub-container">
                    <label class="subtask-item">
                        <input type="checkbox" name="sub1" id="sub1">
                        <span>Research content ideas</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="confirm-btns">
            <button class="btn-delete">Delete Task</button>
            <button class="btn-save">Save changes</button>
        </div>
    </div>
    </div>
</body>
</html>
