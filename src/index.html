<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="menu">
        <div class="top">
            <p>Menu</p>
            <div class="icon">
                <img src="./icons/menu.svg" alt="Menu icon">
            </div>
        </div>

        <div class="search">
            <label for="search">
                <div class="icon">
                    <img src="./icons/magnify.svg" alt="Magnify">
                </div>
            </label>
            <input type="text" name="search" id="search", placeholder="Search", minlength="3">
        </div>

        <div class="tasks">
            <div>
                <div class="icon">
                    <img src="./icons/chevron-double-right.svg" alt="chevron">
                </div>
                Upcoming
            </div>
            <div>
                <div class="icon">
                    <img src="./icons/list-status.svg" alt="status">
                </div>
                Today
            </div>
            <div>
                <div class="icon">
                    <img src="./icons/calendar-month.svg" alt="calendar">
                </div>
                Calendar
            </div>
        </div>
    </div>

    <div class="lists">
        <div>
            <div class="icon">
                <img src="./icons/square-rounded.svg" alt="square">
            </div>
            Personal
        </div>
        <div>
            <div class="icon">
                <img src="./icons/square-rounded.svg" alt="square">
            </div>

            Work</div>
        <div>
            <div class="icon">
                <img src="./icons/square-rounded.svg" alt="square">
            </div>
            List
        </div>
        <button>
            <div class="icon">
                <img src="./icons/plus.svg" alt="plus">
            </div>
            Add New List
        </button>
    </div>

    <div class="tags">
        <div>Tag 1</div>
        <div>Tag 2</div>
        <button>
            <div class="icon">
                <img src="./icons/plus.svg" alt="plus">                
            </div>
            Add Tag</button>
    </div>
    
    <div class="settings">
        <div class="icon">
            <img src="./icons/tune.svg" alt="tune icon">
        </div>
        Settings
    </div>

    <div class="sign-out">
        <div class="icon">
            <img src="./icons/logout.svg" alt="logout icon">
        </div>
        Sign out
    </div>
    <div class="task-list"></div>
    <div class="task-cr"></div>
</body>
</html>
